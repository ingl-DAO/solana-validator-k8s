# Tier 2 — the credibility exhibit.
# A real non-voting Agave node syncing Solana testnet. Requires every item in the infra contract
# (terraform/modules/README.md): public address, UDP 8000-8026, node sysctls, runtime rlimits.
mode: follower
cluster: testnet
hostNetwork: true

persistence:
  enabled: true
  storageClassName: oci-bv-hp   # supplied by terraform/modules/oci-oke; swap per provider
  size: 250Gi                   # ledger + snapshots
  accounts:
    enabled: true
    size: 100Gi

advertisedAddress:
  strategy: ipecho

# Sized for VM.Standard.E5.Flex 8 OCPU / 96 GB (ADR 0010), leaving headroom for the kubelet,
# kube-proxy, CNI and the exporter sidecar. No CPU limit: throttling a replay thread is self-harm.
resources:
  requests: { cpu: "6", memory: 72Gi }
  limits:   { memory: 84Gi }

nodeSelector:
  solana.io/node: "true"

monitoring:
  serviceMonitor: { enabled: true }
  prometheusRule: { enabled: true }
  dashboard: { enabled: true }
