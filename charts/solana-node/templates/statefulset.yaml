apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "solana-node.fullname" . }}
  labels: {{- include "solana-node.labels" . | nindent 4 }}
spec:
  # Not a scaling knob. Two pods sharing an identity keypair double-sign; on a voting node that is
  # a slashing story. HA for Solana is gossip-based identity failover, not replica count.
  replicas: 1
  # Kubernetes' default surge-before-terminate semantics are actively hostile to this workload.
  updateStrategy:
    type: OnDelete
  serviceName: {{ include "solana-node.fullname" . }}-headless
  selector:
    matchLabels: {{- include "solana-node.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "solana-node.labels" . | nindent 8 }}
      annotations:
        checksum/flags: {{ include (print $.Template.BasePath "/configmap-flags.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
{{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
{{- end }}
{{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
{{- end }}
      securityContext:
        # Agave >=2.0 uses io_uring to unpack snapshots. seccomp RuntimeDefault blocks
        # io_uring_setup/enter/register. The symptom is a failure DURING unpack — minutes in,
        # after a multi-GB download — not a clean refusal at process start.
        seccompProfile:
          type: Unconfined
        # The image runs as uid 10001. Without fsGroup, both the identity Secret and the ledger
        # PVC are mounted root-owned and the validator cannot read or write them:
        #   error: Invalid value for '--identity <KEYPAIR>': Permission denied (os error 13)
        # fsGroup makes the volumes group-owned by this gid; the Secret's mode must then grant
        # group read (0440, not 0400).
        runAsUser: {{ .Values.podSecurity.runAsUser }}
        runAsGroup: {{ .Values.podSecurity.runAsGroup }}
        fsGroup: {{ .Values.podSecurity.fsGroup }}
        # Without this, Kubernetes recursively chowns the ENTIRE volume on every start. Harmless
        # on an empty PVC; on a 250GB ledger it adds minutes to each restart.
        fsGroupChangePolicy: OnRootMismatch
      affinity:
{{- if .Values.affinity }}
{{- toYaml .Values.affinity | nindent 8 }}
{{- else }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels: {{- include "solana-node.selectorLabels" . | nindent 16 }}
{{- end }}
{{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
{{- end }}
      containers:
      - name: validator
        image: {{ include "solana-node.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["/bin/bash", "/flags/run.sh"]
        securityContext:
          # Agave 4.0+ exits(1) on a MISSING required capability. XDP transmit is ON BY DEFAULT
          # and needs NET_RAW + NET_ADMIN, so either it is disabled (validator.disableXdp, the
          # default) or those capabilities must be added here.
          capabilities:
            drop: ["ALL"]
{{- with .Values.podSecurity.capabilities.add }}
            add: {{- toYaml . | nindent 14 }}
{{- end }}
          allowPrivilegeEscalation: false
        ports:
        - { name: rpc, containerPort: {{ .Values.ports.rpc }}, protocol: TCP }
{{- if .Values.hostNetwork }}
        - { name: gossip, containerPort: {{ .Values.ports.p2pMin }}, protocol: UDP }
{{- end }}
        resources: {{- toYaml .Values.resources | nindent 10 }}
        startupProbe:
          # See configmap-flags.yaml startup.sh for why this is exec and not tcpSocket.
          # 720 * 10s = 2h, which is what snapshot fetch + index build + replay need.
          exec:
            command: ["/bin/bash", "/probes/startup.sh"]
          periodSeconds: 10
          failureThreshold: {{ if eq .Values.mode "test-validator" }}30{{ else }}720{{ end }}
        readinessProbe:
          exec:
            command: ["/bin/bash", "/probes/readiness.sh"]
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 2
        # NO livenessProbe, deliberately. A catching-up node is unready, never unhealthy. A
        # liveness probe tied to sync progress restart-loops forever, and every restart costs
        # another snapshot fetch — it converts a slow start into an outage that never ends.
{{- if eq .Values.mode "follower" }}
        lifecycle:
          preStop:
            exec:
              command: ["agave-validator", "--ledger", "/data/ledger", "exit",
                        "--force", "--skip-health-check", "--skip-new-snapshot-check"]
{{- end }}
        volumeMounts:
        - { name: data, mountPath: /data }
{{- if and .Values.persistence.enabled .Values.persistence.accounts.enabled }}
        - { name: accounts, mountPath: /accounts }
{{- end }}
        - { name: flags, mountPath: /flags }
        - { name: probes, mountPath: /probes }
{{- if eq .Values.mode "follower" }}
        - { name: keys, mountPath: /keys, readOnly: true }
{{- end }}
{{- if .Values.exporter.enabled }}
      - name: exporter
        image: {{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag }}
        imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
        args:
        # With hostNetwork the sidecar shares the host netns, so it reaches RPC over loopback.
        # The JSON-RPC port is therefore never on the wire at all — stronger than an NSG rule.
        - "-rpc-url"
        - "http://127.0.0.1:{{ .Values.ports.rpc }}"
{{- if .Values.exporter.lightMode }}
        - "-light-mode"
{{- end }}
        - "-listen-address"
        - "0.0.0.0:{{ .Values.ports.metrics }}"
        - "-slot-pace"
        - "{{ .Values.exporter.slotPace }}"
        ports:
        - { name: metrics, containerPort: {{ .Values.ports.metrics }}, protocol: TCP }
        resources: {{- toYaml .Values.exporter.resources | nindent 10 }}
        securityContext:
          capabilities: { drop: ["ALL"] }
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
{{- end }}
      volumes:
      - name: flags
        configMap:
          name: {{ include "solana-node.fullname" . }}-flags
          defaultMode: 0755
      - name: probes
        configMap:
          name: {{ include "solana-node.fullname" . }}-flags
          items:
          - { key: readiness.sh, path: readiness.sh }
          - { key: startup.sh, path: startup.sh }
          defaultMode: 0755
{{- if eq .Values.mode "follower" }}
      - name: keys
        secret:
          secretName: {{ include "solana-node.fullname" . }}-identity
          # 0440, not 0400: fsGroup grants access via the GROUP bits, so the owner-only mode
          # leaves the file unreadable to the non-root uid the container runs as.
          defaultMode: 0440
{{- end }}
{{- if not .Values.persistence.enabled }}
      - name: data
        emptyDir: {}
{{- else }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: {{- toYaml .Values.persistence.accessModes | nindent 8 }}
      storageClassName: {{ .Values.persistence.storageClassName | quote }}
      resources:
        requests:
          storage: {{ .Values.persistence.size }}
{{- if .Values.persistence.accounts.enabled }}
  # Separate volume for the accounts DB. Anza recommends accounts and ledger on separate
  # spindles; the two have different IO profiles and contend badly when sharing one.
  - metadata:
      name: accounts
    spec:
      accessModes: {{- toYaml .Values.persistence.accessModes | nindent 8 }}
      storageClassName: {{ .Values.persistence.storageClassName | quote }}
      resources:
        requests:
          storage: {{ .Values.persistence.accounts.size }}
{{- end }}
{{- end }}
