# Default values for solana-node.
#
# PORTABILITY: nothing in this chart references a cloud provider. The requirements it places on
# whatever cluster it lands in are written down in terraform/modules/README.md. Keep it that way —
# if you find yourself adding an OCI/AWS/GCP-specific value here, it belongs in the infra layer.

# mode selects which of the two tiers this release runs.
#   test-validator : solana-test-validator. ClusterIP, no hostNetwork, no snapshot fetch.
#                    Runs on kind with no cloud credentials. Used by CI and `make dev-up`.
#   follower       : a real non-voting Agave node syncing a live cluster. Needs hostNetwork,
#                    a public address, and every requirement in the infra contract.
mode: test-validator

cluster: testnet   # testnet | devnet — only meaningful when mode=follower

image:
  repository: ghcr.io/marcjazz/agave
  tag: ""          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# Only needed if the image is in a PRIVATE registry. GHCR packages default to private even when
# the source repo is public, and the resulting failure is an ImagePullBackOff that says
# "unauthorized" without mentioning visibility. Prefer making the package public; use this when
# you cannot. Create the secret with:
#   kubectl create secret docker-registry ghcr \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=$(gh auth token)
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# --- networking -------------------------------------------------------------------------------
# hostNetwork is REQUIRED for mode=follower: gossip peers must reach the node at the address it
# advertises, and NodePort remapping breaks that. See ADR 0005.
hostNetwork: false

ports:
  rpc: 8899
  websocket: 8900
  metrics: 8080
  # Agave 4.1 raised MINIMUM_VALIDATOR_PORT_RANGE_WIDTH to 26, and the range is half-open
  # [min, max). The 8000-8020 in essentially every firewall guide on the internet is now too
  # narrow and Agave will refuse to start.
  p2pMin: 8000
  p2pMax: 8026

# How the node determines the address it advertises to peers.
#   ipecho : let Agave resolve it by IP-echo against --entrypoint. Correct for 1:1 NAT
#            (OCI, AWS). --gossip-host was REMOVED in Agave 4.0; do not look for it.
#   static : pass advertisedIp explicitly via the hidden --advertised-ip flag.
advertisedAddress:
  strategy: ipecho
  staticIp: ""

# --- storage ----------------------------------------------------------------------------------
persistence:
  enabled: true
  # Supplied by the infra layer. Never define a StorageClass in this chart.
  storageClassName: ""
  accessModes: ["ReadWriteOnce"]
  # Ledger + snapshots. Sized so --limit-ledger-size 50000000 (the floor Agave permits, ~125 GB
  # worst case with coding shreds) fits with room to spare, rather than being alert-managed.
  size: 250Gi
  accounts:
    # Anza recommends accounts and ledger on separate spindles. Originally skipped because the
    # quota was believed to be 200 GB; the real limit is 30 TB per AD, so it costs nothing to do
    # the right thing here. See docs/decisions/0007 (corrected).
    enabled: true
    size: 100Gi

# --- validator tuning -------------------------------------------------------------------------
validator:
  # FIFO ceiling on the blockstore, in shreds. 50000000 is the legacy MINIMUM Agave permits on
  # 4.2.x; you cannot configure a smaller one. At ~1250 B/shred that is ~62 GB of data shreds and,
  # with coding shreds, potentially ~125 GB on disk — larger than the whole 200 GB OCI trial quota
  # minus boot volumes. It is a ceiling, not a preallocation, and testnet sits far below it in
  # practice. The real protection is the SolanaLedgerDiskFilling alert. See LIMITATIONS.md.
  limitLedgerSize: 50000000
  # ~5 min of testnet slots. After an overnight scale-to-zero the node refetches a fresh 5.3 GB
  # snapshot rather than replaying a stale one. Cheap only because this is testnet: on devnet the
  # same setting would cost a 65.9 GB download every morning.
  maximumLocalSnapshotAge: 1500
  healthCheckSlotDistance: 150
  # --accounts-index-limit. NOT a number of megabytes: an ENUM.
  # Allowed: minimal | 25GB | 50GB | 100GB | 200GB | 400GB | 800GB | unlimited
  #
  # The Agave DEFAULT is `unlimited`, which keeps the entire accounts index resident. That is
  # right for a mainnet box with 256GB and catastrophic anywhere smaller, so it is always set
  # explicitly here. Entries beyond the limit go to the disk-backed index, which is slower.
  #
  # (An earlier revision passed --accounts-index-memory-limit-mb, which does not exist in 4.2.2.
  #  agave-validator rejects unknown flags at startup, so the pod CrashLoops immediately rather
  #  than ignoring it.)
  accountsIndexLimit: 25GB
  # Sync without being reachable. The node stops advertising Gossip/TPU/TVU/Repair ports it
  # cannot serve and pulls blocks via repair instead. It still syncs to tip and still exports
  # every metric; it simply is not a gossip participant, so peer count stays at 0 by design.
  #
  # This is the correct mode behind NAT (a laptop, a home connection) and the documented fallback
  # when inbound UDP cannot be made to work. It implies --no-voting.
  restrictedRepairOnly: false

  # Agave 4.x enables XDP transmit BY DEFAULT, and XDP needs CAP_NET_RAW + CAP_NET_ADMIN. With
  # the capabilities dropped (as they are here) the validator binds every socket, contacts
  # IP-echo, and only THEN exits:
  #   ERROR the current configuration requires the following capabilities, which have not been
  #   permitted to the current process: [CAP_NET_RAW, CAP_NET_ADMIN]
  #
  # XDP is a transmit-path optimisation for pushing transactions. A non-voting follower sends
  # almost nothing, so it buys nothing here and costs two powerful capabilities. Disabled.
  # To enable it, set this false AND add the capabilities under podSecurity.capabilities.add.
  disableXdp: true
  extraFlags: []

resources:
  requests:
    cpu: "5"
    memory: 48Gi
  limits:
    # No CPU limit on purpose: CFS-throttling a replay thread is self-harm.
    memory: 56Gi

# --- exporter ---------------------------------------------------------------------------------
# Agave exposes NO Prometheus endpoint. A repo-wide search for "prometheus" in anza-xyz/agave
# returns zero hits; metrics/ posts InfluxDB v1 line protocol to a single destination which SFDP
# requires to be metrics.solana.com, so it cannot cleanly be teed. RPC polling is therefore the
# architecture, not a workaround.
exporter:
  enabled: true
  image:
    repository: ghcr.io/asymmetric-research/solana-exporter
    tag: v3.1.0
    pullPolicy: IfNotPresent
  lightMode: true
  slotPace: 5
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { memory: 128Mi }

# --- monitoring -------------------------------------------------------------------------------
monitoring:
  # The kube-prometheus-stack release name. Every ServiceMonitor, PrometheusRule and dashboard
  # ConfigMap must carry `release: <this>` — the *SelectorNilUsesHelmValues defaults are all true,
  # and a correct-looking object without that label is silently ignored, with no event and no log.
  releaseLabel: kube-prometheus-stack
  serviceMonitor:
    enabled: true
    interval: 15s
  prometheusRule:
    enabled: true
  dashboard:
    enabled: true

# --- node tuning fallback ---------------------------------------------------------------------
# Preferred path is node-pool cloud-init (see terraform/modules/oci-oke/cloud-init/). Enable this
# only on clusters where you do not own the nodes. It mutates the NODE, not the pod, and
# PodSecurity `baseline`/`restricted` will reject it outright. See ADR 0008.
nodeTuner:
  enabled: false

# Must match the uid/gid baked into the image (USER 10001 in docker/Dockerfile). fsGroup is what
# makes the mounted Secret and PVC accessible to a non-root process.
podSecurity:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  capabilities:
    # Only needed if validator.disableXdp is false: ["NET_RAW", "NET_ADMIN"]
    add: []

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

terminationGracePeriodSeconds: 120
nodeSelector: {}
tolerations: []
affinity: {}
